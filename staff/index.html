<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 stops iPad/iPhone Safari auto-zooming when a small dropdown is tapped (pinch-zoom still works there) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Staff — The Nail Club & Spa</title>
<link rel="icon" href="../photos/logo.png?v=2" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161616;
    --muted: #5f5f5f;
    --line: #e7e4e2;
    --soft: #f7f4f3;
    --bg: #ffffff;
    --accent: #7e93ab;
    --accent-dark: #5a6e86;
    --danger: #a3432f;
    --danger-soft: #f8eae7;
    --radius: 14px;
    --display: 'Outfit', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--soft);
    color: var(--ink);
    font: 16px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  button, select, input { font: inherit; color: inherit; }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  /* Not-set-up / load-failure notice */
  .notice {
    margin: 64px auto;
    max-width: 32em;
    padding: 0 20px;
    text-align: center;
    color: var(--muted);
    font-size: 17px;
  }

  /* Sign-in screen */
  .signin-wrap {
    margin: auto;
    width: 100%;
    max-width: 360px;
    padding: 40px 24px;
  }
  .signin-wrap h1 { font-size: 26px; margin-bottom: 24px; text-align: center; }
  .signin-form { display: grid; gap: 16px; }
  .signin-form label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .signin-form input {
    min-height: 48px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
  }
  .signin-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(126,147,171,.35); }
  .signin-error { min-height: 1.2em; color: var(--danger); font-size: 14px; margin: 0; }

  /* App shell */
  .app-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .app-brand { font: 600 17px/1 var(--display); white-space: nowrap; }
  .app-user { margin-left: auto; font-size: 13px; color: var(--muted); }
  .app-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tab {
    border: 0;
    background: transparent;
    padding: 12px 18px;
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
  }
  .tab[aria-current="page"] { background: var(--ink); color: #fff; }
  .app-content { flex: 1; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; }

  /* Buttons */
  /* Language switch (staff/app.mjs langSwitch) */
  .lang-switch { display: flex; gap: 2px; background: var(--soft); border-radius: 999px; padding: 3px; }
  .lang-switch button {
    border: 0;
    background: transparent;
    min-height: 36px;
    min-width: 44px;
    padding: 0 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .signin-wrap .lang-switch { width: fit-content; margin: 0 auto 20px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-signout { border-color: var(--line); color: var(--muted); }
  .btn-confirm { border-color: var(--accent-dark); background: var(--accent); color: #fff; }
  .btn-decline { border-color: var(--danger); color: var(--danger); }

  /* Requests view */
  .empty { color: var(--muted); text-align: center; margin-top: 48px; font-size: 16px; }
  .error { color: var(--danger); text-align: center; margin-top: 48px; }
  .request-list { display: grid; gap: 16px; }
  .request-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: grid;
    gap: 6px;
  }
  .request-when { font: 600 18px/1.3 var(--display); }
  .request-services { color: var(--muted); font-size: 15px; }
  .request-provider { font-size: 14px; color: var(--accent-dark); font-weight: 500; }
  .request-name { font-size: 15px; margin-top: 4px; }
  .request-notes { font-size: 14px; margin-top: 4px; white-space: pre-line; }
  .request-contact { font-size: 15px; margin-top: 4px; overflow-wrap: anywhere; user-select: text; }
  .request-actions { display: flex; gap: 8px; margin-top: 14px; }
  .confirm-form {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr 1fr;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .confirm-form.hidden { display: none; }
  .confirm-form .field { display: grid; gap: 6px; grid-column: span 1; font-size: 13px; color: var(--muted); }
  .confirm-form select {
    min-height: 44px;
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
  }
  .confirm-form button { grid-column: 1 / -1; }
  .request-status { grid-column: 1 / -1; min-height: 1.2em; font-size: 14px; color: var(--danger); margin: 0; }

  /* Calendar view */
  .calendar-view { display: flex; flex-direction: column; gap: 16px; }
  .calendar-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mode-toggle { display: flex; gap: 4px; background: var(--soft); border-radius: 999px; padding: 4px; }
  .mode-toggle button {
    border: 0;
    background: transparent;
    padding: 8px 16px;
    min-height: 36px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
  }
  .mode-toggle button[aria-current="page"] { background: var(--ink); color: #fff; }
  .calendar-toolbar .btn { min-height: 40px; padding: 0 14px; }
  .calendar-toolbar input[type="date"],
  .week-provider {
    min-height: 40px;
    padding: 0 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
  }
  .week-provider.hidden { display: none; }

  .day-grid-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    -webkit-overflow-scrolling: touch;
  }
  .day-grid { display: flex; min-width: max-content; }
  .hour-gutter { display: flex; flex-direction: column; width: 56px; flex: 0 0 56px; border-right: 1px solid var(--line); }
  .hour-gutter-track { position: relative; }
  .hour-label {
    position: absolute;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    padding-right: 8px;
  }
  .day-col { display: flex; flex-direction: column; width: 150px; flex: 0 0 150px; border-right: 1px solid var(--line); }
  .day-col:last-child { border-right: 0; }
  .day-col.no-shift .day-col-header { color: var(--danger); background: var(--danger-soft); }
  .day-col.no-shift .day-col-track { background-color: var(--danger-soft); }
  .day-col-header {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 600 14px/1.2 var(--display);
    text-align: center;
    padding: 6px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  .day-col-track { position: relative; cursor: pointer; }
  /* Time lines (hour / half hour / 15 min) sit on their own see-through
     layer above the grey shift and red no-shift fills, below appointments,
     so they stay visible on every background. 1px = 1 min. */
  .day-col-track::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(to bottom, rgba(22,22,22,.16) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(to bottom, rgba(22,22,22,.08) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(to bottom, rgba(22,22,22,.04) 0 1px, transparent 1px 15px);
  }
  .shift-block { position: absolute; left: 2px; right: 2px; background: var(--soft); border-radius: 6px; z-index: 0; pointer-events: none; }
  .off-block {
    position: absolute;
    left: 2px;
    right: 2px;
    background: repeating-linear-gradient(45deg, var(--line), var(--line) 4px, transparent 4px, transparent 8px);
    border-radius: 6px;
    z-index: 0;
    pointer-events: none;
  }
  .appt-block {
    position: absolute;
    left: 4px;
    right: 4px;
    border-radius: 8px;
    padding: 4px 6px;
    font-size: 12px;
    line-height: 1.25;
    overflow: hidden;
    color: #fff;
    cursor: pointer;
    z-index: 2; /* above the time lines (.day-col-track::after) */
  }
  /* Pending = not yet confirmed: striped amber, dashed edge, "Pending" tag.
     Confirmed = solid slate. */
  .appt-pending {
    color: var(--ink);
    background: repeating-linear-gradient(135deg, #fbe7bd 0 8px, #f6d898 8px 16px);
    border: 1.5px dashed #b7862b;
  }
  .appt-confirmed { background: var(--accent-dark); }
  .appt-tag {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #7a5512;
  }

  /* Booking editor */
  .editor-host.hidden { display: none; }
  .editor-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22, 22, 22, .45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .editor-card {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px;
  }
  .editor-card h2 { font-size: 20px; margin-bottom: 16px; }
  .editor-form { display: grid; gap: 14px; }
  .editor-form .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .editor-form input,
  .editor-form select,
  .editor-form textarea {
    min-height: 44px;
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    font: inherit;
    color: var(--ink);
  }
  .editor-form textarea { min-height: 72px; resize: vertical; }
  .service-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .service-check {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .service-check input { margin: 0; }
  .editor-status { min-height: 1.2em; color: var(--danger); font-size: 14px; margin: 0; }
  .editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .editor-actions .btn { flex: 1 1 auto; }

  /* Schedules view */
  .schedules-view { display: flex; flex-direction: column; gap: 24px; }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .schedules-view input,
  .schedules-view select,
  .team-view input,
  .team-view select {
    min-height: 44px;
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    font: inherit;
    color: var(--ink);
  }
  .provider-picker-field { max-width: 320px; }
  .hours-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }
  /* Weekly hours: 1×7 — one column per day, Sunday–Saturday. */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(92px, 1fr)); /* all 7 fit an iPad in portrait; phones scroll */
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .weekday-section { display: flex; flex-direction: column; gap: 8px; padding: 10px 5px; border-right: 1px solid var(--line); min-width: 0; }
  .weekday-section:last-child { border-right: 0; }
  .weekday-section h3 { font-size: 14px; text-align: center; padding-bottom: 8px; margin: 0 -5px; border-bottom: 1px solid var(--line); }
  .hours-form h2 { font-size: 18px; }
  .hours-hint { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
  .shift-rows { display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .shift-rows:empty::before { content: attr(data-empty); color: var(--muted); font-size: 13px; text-align: center; padding: 6px 0; }
  /* Start over end, with Remove under them. */
  .shift-row { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .shift-row:last-child { border-bottom: 0; padding-bottom: 0; }
  /* No dropdown arrow (it clipped "10:00 AM" in narrow columns); centered time in a box. */
  .schedules-view .shift-row select { width: 100%; min-width: 0; min-height: 38px; padding: 6px 2px; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; text-align: center; text-align-last: center; cursor: pointer; }
  .shift-sep { color: var(--muted); font-size: 12px; text-align: center; line-height: 1; }
  .shift-remove-btn { min-height: 30px; padding: 0 8px; font-size: 12px; border-color: var(--line); color: var(--muted); }
  .shift-add-btn { min-height: 36px; padding: 0 8px; font-size: 13px; width: 100%; }
  .hours-status { min-height: 1.2em; color: var(--danger); font-size: 14px; margin: 0; }

  .time-off-section {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .time-off-section h2 { font-size: 18px; }
  .time-off-list { display: flex; flex-direction: column; gap: 10px; }
  .time-off-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .time-off-form { display: grid; gap: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .all-day-check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
  .time-off-range { display: flex; gap: 12px; flex-wrap: wrap; }
  .time-off-range.hidden { display: none; }
  .time-off-status { min-height: 1.2em; color: var(--danger); font-size: 14px; margin: 0; }

  /* Staff (team) view */
  .team-view { display: flex; flex-direction: column; gap: 20px; }
  .team-list { display: flex; flex-direction: column; gap: 14px; }
  .team-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .team-item-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .reorder-buttons { display: flex; gap: 4px; }
  .reorder-btn { min-height: 36px; min-width: 36px; padding: 0; font-size: 15px; }
  .team-name-field { display: flex; align-items: center; gap: 8px; flex: 1 1 180px; }
  .team-name-input { flex: 1 1 auto; min-width: 100px; }
  .team-rename-btn { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .team-active-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .team-skills { margin-top: 2px; }
  .team-item-status { min-height: 1.2em; color: var(--danger); font-size: 13px; margin: 0; }
  .team-add-form { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .team-add-form .field { flex: 1 1 220px; }
  .team-status { min-height: 1.2em; color: var(--danger); font-size: 14px; margin: 0; }

  @media (min-width: 640px) {
    .editor-overlay { align-items: center; }
    .editor-card { border-radius: var(--radius); }
  }

  @media (max-width: 480px) {
    .app-header { flex-wrap: wrap; }
    .app-user { order: 3; margin-left: 0; width: 100%; }
    .request-actions { flex-wrap: wrap; }
    .request-actions .btn { flex: 1 1 auto; }
    .confirm-form { grid-template-columns: 1fr; }
    .day-col { width: 120px; flex-basis: 120px; }
    .hour-gutter { width: 44px; flex-basis: 44px; }
    .calendar-toolbar input[type="date"] { flex: 1 1 auto; }
    .team-item-row { flex-direction: column; align-items: stretch; }
    .team-name-field { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="app.mjs"></script>
</body>
</html>
